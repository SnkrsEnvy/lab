name: Publisher Studio G6Q Production Smoke
on:
  push:
    branches:
      - 'publisher-studio-pdf-image-replace-g6q-v018'
    paths:
      - 'web/api/publisher_studio_g5i.py'
      - 'web/requirements.txt'
      - 'web/vercel.json'
      - 'web/publisher-studio/**'
      - '.github/workflows/publisher-studio-g6h-public-g5i-proof.yml'
  pull_request:
    paths:
      - 'web/api/publisher_studio_g5i.py'
      - 'web/requirements.txt'
      - 'web/vercel.json'
      - 'web/publisher-studio/**'
      - '.github/workflows/publisher-studio-g6h-public-g5i-proof.yml'

jobs:
  pdf-image-replace-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      TARGET_URL: https://lab-world-builders.vercel.app/publisher-studio/
      API_URL: https://lab-world-builders.vercel.app/api/publisher-studio-g5i
      EXPECTED_BUILD: PS-PUBLIC-DEMO-G6Q-v018
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser and PDF proof runtime
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0 pymupdf==1.26.7 requests pillow
          python -m playwright install --with-deps chromium
      - name: Run public G6Q image replace proof
        run: |
          python - <<'PY'
          import hashlib, io, json, os, pathlib
          import fitz, requests
          from PIL import Image, ImageChops, ImageDraw
          from playwright.sync_api import sync_playwright, expect

          target=os.environ['TARGET_URL']; api=os.environ['API_URL']; expected_build=os.environ['EXPECTED_BUILD']
          out=pathlib.Path('publisher-studio-g6q-proof'); out.mkdir(exist_ok=True)
          fixture=out/'g6q-image-fixture.pdf'
          replacement_path=out/'g6q-replacement.png'
          src_bbox=[100.0,150.0,220.0,230.0]
          receipt={'target':target,'api':api,'expected_build':expected_build,'checks':{},'console_errors':[],'page_errors':[]}

          def mark(name,value=True,detail=None):
              receipt['checks'][name]=bool(value)
              if detail is not None: receipt.setdefault('detail',{})[name]=detail
              if not value: raise AssertionError(name)

          def pixel_identity(raw):
              with Image.open(io.BytesIO(raw)) as im:
                  im.load()
                  rgb=im.convert('RGB')
                  payload=f"{rgb.width}x{rgb.height}|RGB|".encode('ascii')+rgb.tobytes()
                  return {'pixelSha256':hashlib.sha256(payload).hexdigest(),'width':rgb.width,'height':rgb.height}

          # Source raster.
          src_im=Image.new('RGB',(120,80),(35,92,150))
          dr=ImageDraw.Draw(src_im)
          dr.rectangle((8,8,111,71),outline=(244,203,76),width=5)
          dr.line((10,65,108,15),fill=(255,255,255),width=4)
          dr.rectangle((44,24,76,56),fill=(120,35,90))
          src_buf=io.BytesIO(); src_im.save(src_buf,format='PNG')

          # Replacement raster: deliberately asymmetric and visually distinct.
          repl=Image.new('RGB',(96,64),(205,70,42))
          rr=ImageDraw.Draw(repl)
          rr.polygon([(8,8),(86,14),(52,54)],fill=(32,154,98))
          rr.rectangle((7,43,28,58),fill=(250,220,70))
          rr.line((12,10,88,58),fill=(245,245,245),width=5)
          repl.save(replacement_path,format='PNG')
          replacement_bytes=replacement_path.read_bytes()
          replacement_identity=pixel_identity(replacement_bytes)
          receipt['detail']={'replacement_pixel_sha256':replacement_identity['pixelSha256']}

          doc=fitz.open(); pg=doc.new_page(width=612,height=792)
          pg.insert_text((72,72),'G6Q image replacement control text',fontsize=14,fontname='helv')
          pg.insert_image(fitz.Rect(*src_bbox),stream=src_buf.getvalue(),keep_proportion=False)
          doc.save(str(fixture),garbage=4,deflate=True,clean=True); doc.close()
          source_bytes=fixture.read_bytes(); source_sha=hashlib.sha256(source_bytes).hexdigest()
          receipt['detail']['source_sha256']=source_sha

          src=fitz.open(stream=source_bytes,filetype='pdf')
          try:
              infos=src[0].get_image_info(hashes=True,xrefs=True)
              mark('fixture_one_image',len(infos)==1,[{'bbox':list(x['bbox']),'xref':x.get('xref')} for x in infos])
              source_digest=infos[0]['digest'].hex()
              mark('fixture_bbox_exact',all(abs(float(a)-float(b))<0.05 for a,b in zip(infos[0]['bbox'],src_bbox)),list(infos[0]['bbox']))
          finally: src.close()

          cap=requests.get(api,timeout=60)
          mark('api_http_200',cap.status_code==200,cap.text[:800])
          caps=cap.json()
          mark('api_identity',caps.get('version')=='0.35.0-g5i' and caps.get('gate')=='G5I Distributed Page Delta Lifecycle + Conflict-Safe Undo')
          expected_caps={'replaceText':True,'redact':True,'links':True,'moveImage':True,'resizeImage':True,'rotateImage':True,'deleteImage':True,'replaceImage':True,'pageReorder':True,'pageInsert':True,'pageDelete':True,'undo':True,'exportPdf':True,'ocr':False,'forms':False}
          mark('capability_ceiling',caps.get('capabilities')==expected_caps)

          def render(raw):
              d=fitz.open(stream=raw,filetype='pdf')
              try:
                  pix=d[0].get_pixmap(matrix=fitz.Matrix(2,2),alpha=False)
                  return Image.open(io.BytesIO(pix.tobytes('png'))).convert('RGB')
              finally:d.close()

          def outside_ratio(a,b,rects):
              diff=ImageChops.difference(a,b).convert('L')
              mask=Image.new('L',a.size,255); draw=ImageDraw.Draw(mask)
              sx=a.size[0]/612.0; sy=a.size[1]/792.0
              for rect in rects:
                  x0,y0,x1,y1=rect; pad=12
                  draw.rectangle((int(x0*sx)-pad,int(y0*sy)-pad,int(x1*sx)+pad,int(y1*sy)+pad),fill=0)
              outside=ImageChops.multiply(diff,mask); hist=outside.histogram(); total=max(1,a.size[0]*a.size[1])
              return (total-hist[0])/total

          with sync_playwright() as p:
              browser=p.chromium.launch()
              page=browser.new_page(viewport={'width':1440,'height':1000},accept_downloads=True)
              page.on('console',lambda msg: receipt['console_errors'].append(msg.text) if msg.type=='error' else None)
              page.on('pageerror',lambda exc: receipt['page_errors'].append(str(exc)))
              response=page.goto(target,wait_until='networkidle',timeout=90000)
              mark('page_http_200',response is not None and response.status==200)
              mark('build_identity',page.locator('meta[name="publisher-studio-build"]').get_attribute('content')==expected_build)
              expect(page.locator('#pdfEngineStatus')).to_contain_text('READY',timeout=90000)
              page.locator('#fileTab').click(); page.locator('.file-nav[data-file-view="open"]').click()
              page.locator('#pdfFileInput').set_input_files(str(fixture))
              expect(page.locator('#pdfEngineStatus')).to_contain_text('CONNECTED',timeout=90000)
              bridge=page.evaluate("window.PublisherStudioPdfBridge.status()")
              mark('replace_image_capability_ready',bridge.get('capabilities',{}).get('replaceImage') is True,bridge)

              def stage_replace():
                  page.get_by_role('button',name='PDF',exact=True).click()
                  expect(page.locator('#pdfReplaceImageBtn')).to_be_enabled()
                  page.locator('#pdfReplaceImageBtn').click()
                  choice=page.locator('.pdf-block-choice[data-image]:not([disabled])')
                  expect(choice).to_have_count(1)
                  with page.expect_file_chooser(timeout=10000) as fc:
                      choice.click()
                  fc.value.set_files(str(replacement_path))
                  expect(page.locator('#opsLayer [title="Staged image replacement"]')).to_have_count(1,timeout=15000)

              stage_replace()
              mark('replace_staged',True,page.locator('#toast').inner_text())

              page.get_by_role('button',name='Home',exact=True).click()
              page.locator('#undo').click(); page.wait_for_timeout(300)
              expect(page.locator('#opsLayer [title="Staged image replacement"]')).to_have_count(0)
              mark('replace_undo_clears_stage',True)

              stage_replace()

              export_response={}
              def capture_export(resp):
                  if resp.url.endswith('/api/publisher-studio-g5i') and resp.request.method=='POST' and resp.headers.get('content-type','').startswith('application/pdf'):
                      export_response['status']=resp.status; export_response['headers']=resp.all_headers()
              page.on('response',capture_export)
              page.get_by_role('button',name='Export',exact=True).first.click()
              with page.expect_download(timeout=90000) as di:
                  page.locator('#printPdfBtn').click()
              edited=out/'public-g6q-image-replaced.pdf'; di.value.save_as(str(edited))
              edited_bytes=edited.read_bytes(); edited_sha=hashlib.sha256(edited_bytes).hexdigest()
              h=export_response.get('headers',{})
              mark('export_http_200',export_response.get('status')==200,export_response)
              mark('remote_verification_pass',h.get('x-publisher-verification-pass')=='true')
              mark('remote_render_pass',h.get('x-publisher-render-pass')=='true')
              mark('remote_structural_pass',h.get('x-publisher-structural-pass')=='true')
              mark('remote_source_hash',h.get('x-publisher-source-sha256')==source_sha)
              mark('remote_output_hash',h.get('x-publisher-output-sha256')==edited_sha)
              mark('output_hash_changed',edited_sha!=source_sha,edited_sha)

              outdoc=fitz.open(stream=edited_bytes,filetype='pdf')
              try:
                  infos=outdoc[0].get_image_info(hashes=True,xrefs=True)
                  old_hits=[x for x in infos if x.get('digest') and x['digest'].hex()==source_digest]
                  mark('old_raster_digest_absent',len(old_hits)==0,[{'bbox':list(x['bbox']),'xref':x.get('xref')} for x in old_hits])
                  bbox_hits=[x for x in infos if all(abs(float(a)-float(b))<0.6 for a,b in zip(x['bbox'],src_bbox))]
                  mark('replacement_one_image_same_bbox',len(bbox_hits)==1,[{'bbox':list(x['bbox']),'xref':x.get('xref')} for x in bbox_hits])
                  xref=int(bbox_hits[0].get('xref') or 0)
                  ext=outdoc.extract_image(xref)
                  output_identity=pixel_identity(ext['image'])
                  mark('replacement_pixel_identity_preserved',output_identity['pixelSha256']==replacement_identity['pixelSha256'],{'actual':output_identity,'expected':replacement_identity})
                  mark('control_text_preserved','G6Q image replacement control text' in outdoc[0].get_text('text'))
              finally: outdoc.close()

              src_render=render(source_bytes); out_render=render(edited_bytes)
              r=outside_ratio(src_render,out_render,[src_bbox])
              mark('outside_authorized_rectangle_stable',r<0.00005,r)
              page.screenshot(path=str(out/'g6q-pdf-image-replace-proof.png'),full_page=True)
              mark('no_page_errors',len(receipt['page_errors'])==0,receipt['page_errors'])
              mark('no_console_errors',len(receipt['console_errors'])==0,receipt['console_errors'])
              browser.close()

          receipt['detail']['output_sha256']=edited_sha
          receipt['detail']['source_digest']=source_digest
          receipt['detail']['source_bbox']=src_bbox
          receipt['status']='PASS'
          (out/'receipt.json').write_text(json.dumps(receipt,indent=2),encoding='utf-8')
          print('PUBLISHER_STUDIO_G6Q_PRODUCTION_SMOKE_PASS')
          print(json.dumps(receipt,indent=2))
          PY
      - name: Upload public proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publisher-studio-g6q-production-smoke
          path: publisher-studio-g6q-proof/
          if-no-files-found: warn
