name: Publisher Studio G6L PDF Page Lifecycle Proof
on:
  push:
    branches:
      - 'publisher-studio-pdf-page-lifecycle-g6l-v013'
    paths:
      - 'web/api/publisher_studio_g5i.py'
      - 'web/requirements.txt'
      - 'web/vercel.json'
      - 'web/publisher-studio/**'
      - '.github/workflows/publisher-studio-g6h-public-g5i-proof.yml'
  pull_request:
    paths:
      - 'web/api/publisher_studio_g5i.py'
      - 'web/requirements.txt'
      - 'web/vercel.json'
      - 'web/publisher-studio/**'
      - '.github/workflows/publisher-studio-g6h-public-g5i-proof.yml'

jobs:
  pdf-page-lifecycle-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      TARGET_URL: https://lab-lsa41rjrl-world-builders.vercel.app/publisher-studio/
      API_URL: https://lab-lsa41rjrl-world-builders.vercel.app/api/publisher-studio-g5i
      EXPECTED_BUILD: PS-PUBLIC-DEMO-G6L-v013
      EXPECTED_SOURCE_SHA: da37ed6b61739777d399c7292dbe5f88661f34ade3abae245aaf287d826e3c92
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser and PDF proof runtime
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0 pymupdf==1.26.7 requests pillow
          python -m playwright install --with-deps chromium
      - name: Run public G6L page lifecycle proof
        run: |
          python - <<'PY'
          import hashlib, io, json, os, pathlib
          import fitz, requests
          from PIL import Image, ImageChops
          from playwright.sync_api import sync_playwright, expect

          target=os.environ['TARGET_URL']
          api=os.environ['API_URL']
          expected_build=os.environ['EXPECTED_BUILD']
          expected_source=os.environ['EXPECTED_SOURCE_SHA']
          fixture=pathlib.Path('web/publisher-studio/proof/publisher-studio-demo-g5i.pdf')
          out=pathlib.Path('publisher-studio-g6l-proof'); out.mkdir(exist_ok=True)
          page1_text='Publisher Studio Proof Sheet'
          page2_text='Second Page - Untouched Control'
          receipt={'target':target,'api':api,'expected_build':expected_build,'checks':{},'console_errors':[],'page_errors':[]}

          def mark(name,value=True,detail=None):
              receipt['checks'][name]=bool(value)
              if detail is not None: receipt.setdefault('detail',{})[name]=detail
              if not value: raise AssertionError(name)

          source_bytes=fixture.read_bytes()
          mark('fixture_source_hash',hashlib.sha256(source_bytes).hexdigest()==expected_source)

          cap=requests.get(api,timeout=60)
          mark('api_http_200',cap.status_code==200,cap.text[:700])
          caps=cap.json()
          mark('api_identity',caps.get('version')=='0.35.0-g5i' and caps.get('gate')=='G5I Distributed Page Delta Lifecycle + Conflict-Safe Undo')
          mark('api_stateless',caps.get('stateless') is True and caps.get('transport')=='g6h-stateless-same-origin-v001')
          mark('capability_ceiling',caps.get('capabilities')=={'replaceText':True,'redact':True,'links':True,'pageReorder':True,'pageInsert':True,'pageDelete':True,'undo':True,'exportPdf':True,'ocr':False,'forms':False})

          def render(raw,idx):
              d=fitz.open(stream=raw,filetype='pdf')
              try:
                  pix=d[idx].get_pixmap(matrix=fitz.Matrix(2,2),alpha=False)
                  return Image.open(io.BytesIO(pix.tobytes('png'))).convert('RGB')
              finally:
                  d.close()

          def ratio(a,b):
              if a.size!=b.size:return 1.0
              hist=ImageChops.difference(a,b).convert('L').histogram()
              total=max(1,a.size[0]*a.size[1])
              return (total-hist[0])/total

          with sync_playwright() as p:
              browser=p.chromium.launch()
              page=browser.new_page(viewport={'width':1440,'height':1000},accept_downloads=True)
              page.on('console',lambda msg: receipt['console_errors'].append(msg.text) if msg.type=='error' else None)
              page.on('pageerror',lambda exc: receipt['page_errors'].append(str(exc)))

              def load_fixture():
                  response=page.goto(target,wait_until='networkidle',timeout=90000)
                  mark('page_http_200',response is not None and response.status==200)
                  mark('build_identity',page.locator('meta[name="publisher-studio-build"]').get_attribute('content')==expected_build)
                  expect(page.locator('#pdfEngineStatus')).to_contain_text('READY',timeout=90000)
                  page.locator('#fileTab').click()
                  page.locator('.file-nav[data-file-view="open"]').click()
                  page.locator('#pdfFileInput').set_input_files(str(fixture))
                  expect(page.locator('#pdfEngineStatus')).to_contain_text('CONNECTED',timeout=90000)
                  expect(page.locator('#pageCountStatus')).to_contain_text('2 pages')
                  thumbs=page.locator('#opsThumbs .thumb'); expect(thumbs).to_have_count(2)
                  return thumbs

              # INSERT
              thumbs=load_fixture()
              bridge_state=page.evaluate("window.PublisherStudioPdfBridge.status()")
              mark('page_insert_capability_ready',bridge_state.get('capabilities',{}).get('pageInsert') is True,bridge_state)
              page.get_by_role('button',name='Insert',exact=True).click()
              page.locator('#addPageBtn').click()
              expect(page.locator('#opsThumbs .thumb')).to_have_count(3)
              expect(page.locator('#opsThumbs .thumb').nth(1).locator('small')).to_have_text('Inserted blank page')
              mark('insert_staged',True)

              page.get_by_role('button',name='Home',exact=True).click()
              page.locator('#undo').click()
              expect(page.locator('#opsThumbs .thumb')).to_have_count(2)
              expect(page.locator('#opsThumbs .thumb').nth(0).locator('small')).to_have_text('PDF page 1')
              expect(page.locator('#opsThumbs .thumb').nth(1).locator('small')).to_have_text('PDF page 2')
              mark('insert_undo_restores_source_pages',True)

              page.get_by_role('button',name='Insert',exact=True).click()
              page.locator('#addPageBtn').click()
              expect(page.locator('#opsThumbs .thumb')).to_have_count(3)

              insert_export={}
              def capture_insert(resp):
                  if resp.url.endswith('/api/publisher-studio-g5i') and resp.request.method=='POST' and resp.headers.get('content-type','').startswith('application/pdf'):
                      insert_export['status']=resp.status; insert_export['headers']=resp.all_headers()
              page.on('response',capture_insert)
              page.get_by_role('button',name='Export',exact=True).first.click()
              with page.expect_download(timeout=90000) as di:
                  page.locator('#printPdfBtn').click()
              inserted=out/'public-g6l-inserted.pdf'; di.value.save_as(str(inserted))
              inserted_bytes=inserted.read_bytes(); inserted_sha=hashlib.sha256(inserted_bytes).hexdigest()
              hi=insert_export.get('headers',{})
              mark('insert_export_http_200',insert_export.get('status')==200,insert_export)
              mark('insert_remote_verification_pass',hi.get('x-publisher-verification-pass')=='true')
              mark('insert_remote_render_pass',hi.get('x-publisher-render-pass')=='true')
              mark('insert_remote_structural_pass',hi.get('x-publisher-structural-pass')=='true')
              mark('insert_remote_source_hash',hi.get('x-publisher-source-sha256')==expected_source)
              mark('insert_remote_output_hash',hi.get('x-publisher-output-sha256')==inserted_sha)
              src=fitz.open(stream=source_bytes,filetype='pdf'); ins=fitz.open(stream=inserted_bytes,filetype='pdf')
              try:
                  mark('insert_page_count_3',ins.page_count==3)
                  mark('insert_lineage_text',page1_text in ins[0].get_text('text') and not ins[1].get_text('text').strip() and page2_text in ins[2].get_text('text'))
                  mark('insert_blank_no_images',len(ins[1].get_images(full=True))==0)
                  mark('insert_blank_no_links',len(ins[1].get_links())==0)
                  mark('insert_blank_no_drawings',len(ins[1].get_drawings())==0)
              finally:
                  src.close(); ins.close()
              r10=ratio(render(source_bytes,0),render(inserted_bytes,0))
              r12=ratio(render(source_bytes,1),render(inserted_bytes,2))
              mark('insert_raster_source1_preserved',r10<0.00005,r10)
              mark('insert_raster_source2_preserved',r12<0.00005,r12)

              # DELETE fresh source
              thumbs=load_fixture()
              bridge_state=page.evaluate("window.PublisherStudioPdfBridge.status()")
              mark('page_delete_capability_ready',bridge_state.get('capabilities',{}).get('pageDelete') is True,bridge_state)
              page.locator('#opsThumbs .thumb').nth(1).click()
              page.get_by_role('button',name='Layout',exact=True).click()
              page.locator('#deletePageBtn').click()
              expect(page.locator('#opsThumbs .thumb')).to_have_count(1)
              expect(page.locator('#opsThumbs .thumb').nth(0).locator('small')).to_have_text('PDF page 1')
              mark('delete_staged',True)

              page.get_by_role('button',name='Home',exact=True).click()
              page.locator('#undo').click()
              expect(page.locator('#opsThumbs .thumb')).to_have_count(2)
              expect(page.locator('#opsThumbs .thumb').nth(1).locator('small')).to_have_text('PDF page 2')
              mark('delete_undo_restores_source_pages',True)

              page.locator('#opsThumbs .thumb').nth(1).click()
              page.get_by_role('button',name='Layout',exact=True).click()
              page.locator('#deletePageBtn').click()
              expect(page.locator('#opsThumbs .thumb')).to_have_count(1)

              delete_export={}
              def capture_delete(resp):
                  if resp.url.endswith('/api/publisher-studio-g5i') and resp.request.method=='POST' and resp.headers.get('content-type','').startswith('application/pdf'):
                      delete_export['status']=resp.status; delete_export['headers']=resp.all_headers()
              page.on('response',capture_delete)
              page.get_by_role('button',name='Export',exact=True).first.click()
              with page.expect_download(timeout=90000) as dd:
                  page.locator('#printPdfBtn').click()
              deleted=out/'public-g6l-deleted.pdf'; dd.value.save_as(str(deleted))
              deleted_bytes=deleted.read_bytes(); deleted_sha=hashlib.sha256(deleted_bytes).hexdigest()
              hd=delete_export.get('headers',{})
              mark('delete_export_http_200',delete_export.get('status')==200,delete_export)
              mark('delete_remote_verification_pass',hd.get('x-publisher-verification-pass')=='true')
              mark('delete_remote_render_pass',hd.get('x-publisher-render-pass')=='true')
              mark('delete_remote_structural_pass',hd.get('x-publisher-structural-pass')=='true')
              mark('delete_remote_source_hash',hd.get('x-publisher-source-sha256')==expected_source)
              mark('delete_remote_output_hash',hd.get('x-publisher-output-sha256')==deleted_sha)
              dele=fitz.open(stream=deleted_bytes,filetype='pdf')
              try:
                  mark('delete_page_count_1',dele.page_count==1)
                  mark('delete_retains_source_page1_text',page1_text in dele[0].get_text('text'))
                  mark('delete_removes_source_page2_text',page2_text not in dele[0].get_text('text'))
              finally:
                  dele.close()
              rd=ratio(render(source_bytes,0),render(deleted_bytes,0))
              mark('delete_raster_source1_preserved',rd<0.00005,rd)

              page.screenshot(path=str(out/'g6l-pdf-page-lifecycle-proof.png'),full_page=True)
              mark('no_page_errors',len(receipt['page_errors'])==0,receipt['page_errors'])
              mark('no_console_errors',len(receipt['console_errors'])==0,receipt['console_errors'])
              browser.close()

          receipt['status']='PASS'
          receipt['detail']['insert_output_sha256']=inserted_sha
          receipt['detail']['delete_output_sha256']=deleted_sha
          (out/'receipt.json').write_text(json.dumps(receipt,indent=2),encoding='utf-8')
          print('PUBLISHER_STUDIO_G6L_PDF_PAGE_LIFECYCLE_PROOF_PASS')
          print(json.dumps(receipt,indent=2))
          PY
      - name: Upload public proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publisher-studio-g6l-pdf-page-lifecycle-proof
          path: publisher-studio-g6l-proof/
          if-no-files-found: warn
