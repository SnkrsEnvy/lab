<style>
:root{
  color-scheme:dark;
  --bg:#070604;--panel:#0f0c08;--gold:#e2c273;--muted:#a99b7f;--line:rgba(226,194,115,.22);
  --page-ratio:1086/1448;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:#f4ead5;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
body{min-height:100dvh;background:radial-gradient(circle at 50% -10%,rgba(85,54,18,.28),transparent 44rem),#070604;overflow-x:hidden}
button{font:inherit}
.app{min-height:100dvh;display:grid;grid-template-rows:auto 1fr auto}
.topbar{height:64px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.06);background:rgba(7,6,4,.86);backdrop-filter:blur(18px);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.medal{width:34px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);color:var(--gold);font:700 15px Georgia,serif}
.brandcopy{min-width:0}
.kicker{font-size:8px;letter-spacing:.18em;color:var(--gold)}
.name{font:500 13px Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.issue{text-align:center}
.issue strong{display:block;font:500 16px Georgia,serif}
.issue span{font-size:9px;letter-spacing:.18em;color:var(--muted)}
.actions{justify-self:end;display:flex;gap:7px}
.icon,.modebtn,.navbtn{border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.035);color:#f4ead5;border-radius:12px;cursor:pointer}
.icon{width:40px;height:40px;display:grid;place-items:center}.icon svg{width:18px;height:18px}
.modebtn{height:40px;padding:0 12px;color:var(--gold);font-size:11px;letter-spacing:.06em}
.stage{position:relative;display:grid;place-items:center;min-height:0;padding:22px 14px 14px;overflow:hidden}
.stage:after{content:"";position:absolute;left:12%;right:12%;bottom:1%;height:8%;background:radial-gradient(ellipse,rgba(0,0,0,.72),transparent 68%);filter:blur(14px);pointer-events:none}
.single-wrap{position:relative;z-index:2;width:min(94vw,520px,calc((100dvh - 160px)*.75));aspect-ratio:var(--page-ratio);perspective:1800px;touch-action:pan-y}
.page-card{position:absolute;inset:0;border-radius:18px;overflow:hidden;background:#f3efe5;box-shadow:0 26px 80px rgba(0,0,0,.52),0 0 0 1px rgba(226,194,115,.18);transform-origin:center;transition:transform .38s cubic-bezier(.2,.8,.2,1),opacity .28s ease}
.page-card img{width:100%;height:100%;object-fit:contain;background:#070604;display:block;user-select:none;-webkit-user-drag:none}
.page-card.enter-left{transform:translateX(-18%) rotateY(8deg);opacity:0}
.page-card.enter-right{transform:translateX(18%) rotateY(-8deg);opacity:0}
.placeholder{width:100%;height:100%;display:grid;place-items:center;text-align:center;padding:34px;background:radial-gradient(circle at 50% 22%,rgba(226,194,115,.10),transparent 32%),linear-gradient(150deg,#f5efe3,#ded3be);color:#2d2419}
.placeholder .slot{max-width:330px}
.placeholder .num{font:700 64px/1 Georgia,serif;color:#9b7b35}
.placeholder h2{margin:12px 0 6px;font:700 24px Georgia,serif}
.placeholder p{margin:0;color:#6a5a43;font-size:13px;line-height:1.5}
.placeholder .flag{display:inline-block;margin-top:16px;border:1px solid rgba(80,60,30,.24);border-radius:999px;padding:7px 10px;font-size:10px;letter-spacing:.11em;text-transform:uppercase}
.spread-wrap{display:none;position:relative;z-index:2;width:min(96vw,1120px);aspect-ratio:1.5;perspective:2200px}
.spread-wrap.show{display:block}
.spread{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;gap:2px;transform-style:preserve-3d}
.panel{position:relative;overflow:hidden;background:#f3efe5;box-shadow:0 26px 80px rgba(0,0,0,.45)}
.panel.left{border-radius:18px 2px 2px 18px;transform-origin:right center;animation:openLeft .72s cubic-bezier(.2,.8,.2,1)}
.panel.right{border-radius:2px 18px 18px 2px;transform-origin:left center;animation:openRight .72s cubic-bezier(.2,.8,.2,1)}
.panel img{width:100%;height:100%;object-fit:contain;background:#070604;display:block}
.spine{position:absolute;z-index:4;left:50%;top:0;bottom:0;width:10px;transform:translateX(-50%);background:linear-gradient(90deg,rgba(0,0,0,.40),rgba(255,255,255,.16) 46%,rgba(0,0,0,.40));box-shadow:0 0 18px rgba(0,0,0,.35);pointer-events:none}
@keyframes openLeft{from{transform:rotateY(74deg);opacity:.3}to{transform:rotateY(0);opacity:1}}
@keyframes openRight{from{transform:rotateY(-74deg);opacity:.3}to{transform:rotateY(0);opacity:1}}
.edge{position:absolute;z-index:10;top:16%;bottom:16%;width:15vw;max-width:120px;border:0;background:transparent;color:#fff;opacity:.18;cursor:pointer}.edge:hover{opacity:.75}.edge.prev{left:0}.edge.next{right:0}
.bottombar{min-height:78px;display:grid;place-items:center;padding:7px 12px 14px}
.controls{width:min(96vw,520px);display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;padding:7px;border:1px solid rgba(255,255,255,.07);border-radius:18px;background:rgba(15,12,8,.80);backdrop-filter:blur(16px)}
.navbtn{width:44px;height:44px;font-size:20px}.navbtn:disabled{opacity:.28;cursor:default}
.state{text-align:center;min-width:0}.state strong{display:block;font:500 14px Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.state span{display:block;margin-top:3px;font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.progress{height:2px;margin:7px auto 0;width:min(180px,80%);background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;width:25%;background:linear-gradient(90deg,#8f6929,#efd58b);transition:width .3s ease}
.notice{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:25;padding:8px 12px;border-radius:999px;border:1px solid rgba(226,194,115,.18);background:rgba(8,6,4,.88);color:#c8b991;font-size:10px;letter-spacing:.06em;pointer-events:none}
.notice.hidden{display:none}
@media(max-width:760px){
  .topbar{grid-template-columns:1fr auto;height:58px}.issue{display:none}.name{max-width:145px}.modebtn{padding:0 10px}
  .stage{padding:14px 8px 8px}.single-wrap{width:min(94vw,calc((100dvh - 145px)*.75))}
  .spread-wrap{width:min(98vw,740px);aspect-ratio:1.5}.spread{gap:1px}
  .placeholder{padding:14px}.placeholder .num{font-size:42px}.placeholder h2{font-size:18px}.placeholder p{font-size:11px}
}
@media(max-width:520px){
  .spread-wrap{aspect-ratio:.78}.spread{grid-template-columns:1fr;grid-template-rows:1fr 1fr}.panel.left,.panel.right{border-radius:12px}.spine{display:none}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand"><div class="medal">GG</div><div class="brandcopy"><div class="kicker">CANNACARDZ · SERIES 3</div><div class="name">#163 · Gelato 41</div></div></div>
  <div class="issue"><strong>4-Page Graphic Trading Card</strong><span>Canon 4-page viewer · staging</span></div>
  <div class="actions">
    <button class="modebtn" id="modeBtn" type="button" aria-label="Toggle unfold mode">Unfold Card</button>
    <button class="icon" id="fsBtn" type="button" aria-label="Toggle fullscreen" title="Fullscreen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 4H4v4M16 4h4v4M8 20H4v-4M16 20h4v-4"/></svg></button>
  </div>
</header>
<main class="stage" id="stage" aria-label="CannaCardz viewer">
  <button class="edge prev" id="edgePrev" aria-label="Previous page"></button>
  <button class="edge next" id="edgeNext" aria-label="Next page"></button>
  <div class="single-wrap" id="singleWrap" aria-live="polite"></div>
  <div class="spread-wrap" id="spreadWrap" aria-live="polite">
    <div class="spread">
      <section class="panel left" id="panelLeft"></section>
      <section class="panel right" id="panelRight"></section>
      <div class="spine"></div>
    </div>
  </div>
</main>
<footer class="bottombar">
  <div class="controls">
    <button class="navbtn" id="prevBtn" type="button" aria-label="Previous page">‹</button>
    <div class="state"><strong id="stateTitle">Front Cover</strong><span id="stateMeta">Page 1 of 4 · Card mode</span><div class="progress"><i id="prog"></i></div></div>
    <button class="navbtn" id="nextBtn" type="button" aria-label="Next page">›</button>
  </div>
</footer>
</div>
<div class="notice" id="notice">Swipe or use ← → · Unfold reveals the inner spread</div>
<script>
const PAGES = [
  {id:1,label:"Front Cover",role:"front",src:"cover-v5-master.jpg",ready:true,width:1086,height:1448},
  {id:2,label:"Inside Left",role:"inside-left",src:"page-2.jpg",ready:true,width:810,height:1200},
  {id:3,label:"Inside Right",role:"inside-right",src:"page-3.jpg",ready:true,width:809,height:1200},
  {id:4,label:"Back Cover",role:"back",src:"page-4.jpg",ready:true,width:900,height:1200}
];
let index=0, mode="card", touchX=null, busy=false;
const singleWrap=document.getElementById("singleWrap"), spreadWrap=document.getElementById("spreadWrap");
const stateTitle=document.getElementById("stateTitle"), stateMeta=document.getElementById("stateMeta"), prog=document.getElementById("prog");
const prevBtn=document.getElementById("prevBtn"), nextBtn=document.getElementById("nextBtn"), edgePrev=document.getElementById("edgePrev"), edgeNext=document.getElementById("edgeNext");
const modeBtn=document.getElementById("modeBtn"), panelLeft=document.getElementById("panelLeft"), panelRight=document.getElementById("panelRight");

function placeholder(page){
  return '<div class="placeholder"><div class="slot"><div class="num">'+page.id+'</div><h2>'+page.label+'</h2><p>Viewer slot is built and wired. The authoritative #163 page artwork has not been found in the available project assets, so this staging build refuses to invent or substitute canon.</p><span class="flag">Canon asset pending</span></div></div>';
}
function pageMarkup(page){
  return page.ready ? '<img src="'+page.src+'" alt="CannaCardz #163 Gelato 41 '+page.label+'">' : placeholder(page);
}
function renderCard(direction=0){
  mode="card"; modeBtn.textContent="Unfold Card"; spreadWrap.classList.remove("show"); singleWrap.style.display="block";
  const p=PAGES[index]; singleWrap.style.aspectRatio=p.width+" / "+p.height; const el=document.createElement("section"); el.className="page-card"+(direction<0?" enter-left":direction>0?" enter-right":""); el.innerHTML=pageMarkup(p);
  singleWrap.replaceChildren(el); requestAnimationFrame(()=>el.classList.remove("enter-left","enter-right"));
  stateTitle.textContent=p.label; stateMeta.textContent="Page "+(index+1)+" of 4 · Card mode"; prog.style.width=((index+1)/4*100)+"%";
  prevBtn.disabled=edgePrev.disabled=index===0; nextBtn.disabled=edgeNext.disabled=index===3;
}
function renderUnfold(){
  mode="unfold"; singleWrap.style.display="none"; spreadWrap.classList.add("show"); modeBtn.textContent="Card Mode";
  spreadWrap.style.aspectRatio=(PAGES[1].width+PAGES[2].width)+" / "+Math.max(PAGES[1].height,PAGES[2].height); panelLeft.innerHTML=pageMarkup(PAGES[1]); panelRight.innerHTML=pageMarkup(PAGES[2]);
  stateTitle.textContent="Inside Spread"; stateMeta.textContent="Pages 2–3 · Unfold mode"; prog.style.width="75%";
  prevBtn.disabled=edgePrev.disabled=false; nextBtn.disabled=edgeNext.disabled=false;
}
function go(delta){
  if(busy)return; busy=true; setTimeout(()=>busy=false,260);
  if(mode==="unfold"){ if(delta<0){index=0;renderCard(-1)}else{index=3;renderCard(1)} return; }
  const next=Math.max(0,Math.min(3,index+delta)); if(next===index)return; index=next; renderCard(delta);
}
function toggleMode(){
  if(mode==="unfold"){renderCard(0);return}
  if(index===1||index===2){renderUnfold();return}
  index=1; renderUnfold();
}
prevBtn.onclick=()=>go(-1);nextBtn.onclick=()=>go(1);edgePrev.onclick=()=>go(-1);edgeNext.onclick=()=>go(1);modeBtn.onclick=toggleMode;
document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft")go(-1);if(e.key==="ArrowRight")go(1);if(e.key.toLowerCase()==="u")toggleMode()});
document.getElementById("stage").addEventListener("touchstart",e=>touchX=e.changedTouches[0].clientX,{passive:true});
document.getElementById("stage").addEventListener("touchend",e=>{if(touchX==null)return;const dx=e.changedTouches[0].clientX-touchX;touchX=null;if(Math.abs(dx)>46)go(dx<0?1:-1)},{passive:true});
document.getElementById("fsBtn").onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){}};
setTimeout(()=>document.getElementById("notice").classList.add("hidden"),4200);
renderCard();
</script>
</body></html>
