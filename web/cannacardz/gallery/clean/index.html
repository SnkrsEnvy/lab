<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="cc-gallery-build" content="cc-gallery-clean-v1">
<title>CannaCardz · Transparent Vertical Gallery</title>
<style>
  :root{color-scheme:light dark}
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}
  body{display:grid;place-items:center;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
  .cc-shell{width:min(100%,420px);height:100%;min-height:320px;position:relative;background:transparent}
  .cc-viewport{width:100%;height:100%;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;scroll-behavior:smooth;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;background:transparent;outline:none}
  .cc-viewport::-webkit-scrollbar{display:none}
  .cc-stack{width:100%;min-height:100%}
  .cc-slide{height:100%;width:100%;display:grid;place-items:center;scroll-snap-align:start;scroll-snap-stop:always;background:transparent;padding:0;margin:0}
  .cc-card{display:block;width:100%;height:100%;outline:none;background:transparent;text-decoration:none}
  .cc-card:focus-visible{box-shadow:inset 0 0 0 3px rgba(31,103,197,.55);border-radius:14px}
  .cc-card img{display:block;width:100%;height:100%;object-fit:contain;object-position:center;background:transparent;border:0;user-select:none;-webkit-user-drag:none}
  @media (prefers-reduced-motion:reduce){.cc-viewport{scroll-behavior:auto}}
</style>
</head>
<body>
  <main class="cc-shell" aria-label="CannaCardz vertical gallery">
    <div class="cc-viewport" id="gallery" tabindex="0"></div>
  </main>
<script type="module">
  import { buildGallery } from '../shared/gallery.js';
  buildGallery({ viewport: document.getElementById('gallery'), variant: 'clean' });
</script>
</body>
</html>
